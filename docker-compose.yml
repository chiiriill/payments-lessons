services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://payments:payments@postgres:5432/payments?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  mock-provider:
    build:
      context: .
      args:
        CMD: mock-provider
    environment:
      WEBHOOK_SECRET: local-secret
      WEBHOOK_TARGET_URL: http://app:8080/webhooks/mock-provider
    ports:
      - "8081:8081"

  app:
    build:
      context: .
      args:
        CMD: app
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      PROVIDER_BASE_URL: http://mock-provider:8081
      WEBHOOK_SECRET: local-secret
    ports:
      - "8080:8081"
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      args:
        CMD: worker
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      PROVIDER_BASE_URL: http://mock-provider:8081
    depends_on:
      migrate:
        condition: service_completed_successfully
