services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-payments}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mock-provider:
    build:
      context: .
      dockerfile: Dockerfile.mock-provider
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-secret}
      WEBHOOK_TARGET_URL: http://app:8080/webhooks/mock-provider
    ports:
      - "${PROVIDER_PORT:-8081}:8081"
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-payments}?sslmode=disable
      PROVIDER_BASE_URL: http://mock-provider:8081
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-secret}
      HTTP_ADDR: :8080
      METRICS_ADDR: :9090
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${METRICS_PORT:-9090}:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-payments}?sslmode=disable
      PROVIDER_BASE_URL: http://mock-provider:8081
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
