services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://payments:payments@postgres:5432/payments?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mock-provider:
    build:
      context: .
      dockerfile: Dockerfile.mock-provider
    environment:
      WEBHOOK_SECRET: local-secret
      WEBHOOK_TARGET_URL: http://app:8080/webhooks/mock-provider
    ports:
      - "8081:8081"
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      PROVIDER_BASE_URL: http://mock-provider:8081
      WEBHOOK_SECRET: local-secret
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      PROVIDER_BASE_URL: http://mock-provider:8081
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
